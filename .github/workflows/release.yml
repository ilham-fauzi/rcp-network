name: Build Windows / Linux

# Builds the Windows Setup exe and the Linux AppImage and keeps them as
# workflow artifacts. Nothing is published and no signing key is used here:
# download the artifacts into dist/ and run scripts/release.sh locally.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # keytar links against libsecret on Linux
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Build Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: rcp-network-${{ matrix.os }}
          path: |
            dist/RCP-Network-Setup-*.exe
            dist/RCP-Network-*.AppImage
          if-no-files-found: error
